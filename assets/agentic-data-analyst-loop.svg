<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="How the agentic data analyst works: a think, act, observe loop over three SQL tools">
  <title>Agentic Data Analyst - the agent loop, its tools, and the evaluation result</title>
  <desc>Top: a three step loop. Step 1 Think, the model decides which tool it needs. Step 2 Act, the application code runs that tool, never the model itself. Step 3 Observe, the model reads the result back as text. The loop repeats until the agent can answer. Middle: the agent's three tools are list_tables, get_schema and run_sql, and they query a DuckDB database of 1,017,209 Rossmann store sales rows over a read-only connection. Guardrails are a SELECT-only check, SQL comment stripping, a query timeout, and row and character caps. Bottom: the results are 72 of 72 gold set cases passed across 3 runs, 63 tests, 3 tools, and zero dollars running cost.</desc>

  <defs>
    <linearGradient id="ada-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="ada-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a63"/>
    </marker>
    <marker id="ada-arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#0d0d15"/>
  <rect x="36" y="24" width="86" height="4" rx="2" fill="url(#ada-accent)"/>

  <!-- ==================== HEADING ==================== -->
  <text x="36" y="62" font-family="Consolas, monospace" font-size="15" fill="#22d3ee"
        letter-spacing="1.5">THE AGENT LOOP</text>
  <text x="36" y="94" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24"
        font-weight="700" fill="#e8e8f0">It picks a tool, runs it, reads the result, and decides again</text>

  <!-- ==================== LOOP: three steps ==================== -->
  <!-- 1 Think -->
  <rect x="36" y="122" width="290" height="168" rx="14" fill="#12121c" stroke="#2a2a3d" stroke-width="1"/>
  <circle cx="66" cy="156" r="16" fill="#8b5cf6"/>
  <text x="66" y="162" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17"
        font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="94" y="163" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="23"
        font-weight="700" fill="#e8e8f0">Think</text>
  <text x="62" y="206" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16"
        fill="#9494ab">Which tool do I need?</text>
  <text x="62" y="248" font-family="Consolas, monospace" font-size="14" fill="#6f6f88">gemini-3.1-flash-lite</text>

  <!-- 2 Act -->
  <rect x="354" y="122" width="290" height="168" rx="14" fill="#12121c" stroke="#2a2a3d" stroke-width="1"/>
  <circle cx="384" cy="156" r="16" fill="#d946ef"/>
  <text x="384" y="162" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17"
        font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="412" y="163" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="23"
        font-weight="700" fill="#e8e8f0">Act</text>
  <text x="380" y="206" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16"
        fill="#9494ab">Your code runs it</text>
  <text x="380" y="248" font-family="Consolas, monospace" font-size="14" fill="#6f6f88">not the model</text>

  <!-- 3 Observe -->
  <rect x="672" y="122" width="290" height="168" rx="14" fill="#12121c" stroke="#2a2a3d" stroke-width="1"/>
  <circle cx="702" cy="156" r="16" fill="#22d3ee"/>
  <text x="702" y="162" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17"
        font-weight="700" fill="#0d0d15" text-anchor="middle">3</text>
  <text x="730" y="163" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="23"
        font-weight="700" fill="#e8e8f0">Observe</text>
  <text x="698" y="206" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16"
        fill="#9494ab">Read the result as text</text>
  <text x="698" y="248" font-family="Consolas, monospace" font-size="14" fill="#6f6f88">then decide again</text>

  <!-- arrows between the three steps -->
  <line x1="330" y1="206" x2="348" y2="206" stroke="#4a4a63" stroke-width="2" marker-end="url(#ada-arrow)"/>
  <line x1="648" y1="206" x2="666" y2="206" stroke="#4a4a63" stroke-width="2" marker-end="url(#ada-arrow)"/>

  <!-- return path: observe -> think -->
  <path d="M 817 290 L 817 316 L 181 316 L 181 296" fill="none" stroke="#4a4a63"
        stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ada-arrow)"/>
  <text x="499" y="338" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15"
        fill="#6f6f88" text-anchor="middle">repeat until it can answer</text>

  <!-- ==================== TOOLS + DATABASE ==================== -->
  <text x="36" y="384" font-family="Consolas, monospace" font-size="14" fill="#22d3ee"
        letter-spacing="1.2">THREE TOOLS</text>

  <rect x="36" y="398" width="196" height="46" rx="10" fill="#161624" stroke="#2f2f45" stroke-width="1"/>
  <text x="134" y="427" font-family="Consolas, monospace" font-size="16" fill="#c9c9dd"
        text-anchor="middle">list_tables</text>

  <rect x="246" y="398" width="196" height="46" rx="10" fill="#161624" stroke="#2f2f45" stroke-width="1"/>
  <text x="344" y="427" font-family="Consolas, monospace" font-size="16" fill="#c9c9dd"
        text-anchor="middle">get_schema</text>

  <rect x="456" y="398" width="196" height="46" rx="10" fill="#161624" stroke="#2f2f45" stroke-width="1"/>
  <text x="554" y="427" font-family="Consolas, monospace" font-size="16" fill="#c9c9dd"
        text-anchor="middle">run_sql</text>

  <line x1="662" y1="421" x2="700" y2="421" stroke="#22d3ee" stroke-width="2" marker-end="url(#ada-arrow-cyan)"/>

  <!-- database -->
  <rect x="710" y="376" width="252" height="90" rx="12" fill="#12121c" stroke="#22d3ee" stroke-width="1.4"/>
  <text x="836" y="404" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18"
        font-weight="700" fill="#e8e8f0" text-anchor="middle">DuckDB</text>
  <text x="836" y="428" font-family="Consolas, monospace" font-size="15" fill="#22d3ee"
        text-anchor="middle">1,017,209 rows</text>
  <text x="836" y="450" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14"
        fill="#9494ab" text-anchor="middle">read-only connection</text>

  <!-- ==================== GUARDRAILS ==================== -->
  <text x="36" y="500" font-family="Consolas, monospace" font-size="14" fill="#d946ef"
        letter-spacing="1.2">GUARDRAILS</text>
  <text x="36" y="524" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" fill="#9494ab">SELECT-only check  /  comment stripping  /  query timeout  /  row and character caps</text>

  <!-- ==================== PROOF ==================== -->
  <line x1="36" y1="546" x2="962" y2="546" stroke="#2a2a3d" stroke-width="1"/>

  <text x="152" y="586" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="32"
        font-weight="700" fill="#22d3ee" text-anchor="middle">72/72</text>
  <text x="152" y="606" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14"
        fill="#9494ab" text-anchor="middle">gold set, 3 runs</text>

  <text x="384" y="586" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="32"
        font-weight="700" fill="#e8e8f0" text-anchor="middle">63</text>
  <text x="384" y="606" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14"
        fill="#9494ab" text-anchor="middle">tests passing</text>

  <text x="616" y="586" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="32"
        font-weight="700" fill="#e8e8f0" text-anchor="middle">0</text>
  <text x="616" y="606" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14"
        fill="#9494ab" text-anchor="middle">flaky cases</text>

  <text x="848" y="586" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="32"
        font-weight="700" fill="#e8e8f0" text-anchor="middle">$0</text>
  <text x="848" y="606" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14"
        fill="#9494ab" text-anchor="middle">running cost</text>
</svg>
